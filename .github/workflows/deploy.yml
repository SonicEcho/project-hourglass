name: Test and Deploy

# すべてのブランチへの push で、テストとビルド（約1分）。main の時だけ、通れば公開する。
# PR の時は走らせない（ブランチへの push で同じ確認が走り、その結果が PR にも出るため。2回走らせると待ち時間が倍になる）
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist

  # テストが1つでも失敗したら test ジョブが失敗し、公開されない。
  # 通しの自動確認（e2e）は、公開を待たせないよう別の流れ（e2e.yml）にした（2026-11-05。開発者と決めた）
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
