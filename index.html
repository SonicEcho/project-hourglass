<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#121831" />
    <title>RESTOPIA - Battle Prototype</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #121831; overflow: hidden; }
      /* iPhone の画面の端（ノッチ・下のバー）にゲームの画面がかからないようにする（段階32a 調整1） */
      #game { position: fixed; left: env(safe-area-inset-left); right: env(safe-area-inset-right); top: env(safe-area-inset-top); bottom: env(safe-area-inset-bottom); }
      #build-info {
        position: fixed; right: 4px; bottom: calc(4px + env(safe-area-inset-bottom));
        font: 10px/1.2 monospace; color: rgba(255, 255, 255, 0.55);
        pointer-events: none; z-index: 10; white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="build-info"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
