<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#121831" />
    <!-- ホーム画面に追加して、アドレスバーのない全画面で開く（段階48。docs/design/tech.md の 8.） -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>RESTOPIA - Battle Prototype</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #121831; overflow: hidden; }
      /* iPhone の画面の端（ノッチ・下のバー）にゲームの画面がかからないようにする（段階32a 調整1） */
      #game { position: fixed; left: env(safe-area-inset-left); right: env(safe-area-inset-right); top: env(safe-area-inset-top); bottom: env(safe-area-inset-bottom); }
      #build-info {
        position: fixed; right: 4px; bottom: calc(4px + env(safe-area-inset-bottom));
        font: 10px/1.2 monospace; color: rgba(255, 255, 255, 0.55);
        pointer-events: none; z-index: 10; white-space: nowrap;
      }
      /* 保存できていない時の印（段階124）。書き込めない間だけ出し、タップでもう一度保存する */
      #save-notice {
        position: fixed; left: 50%; top: calc(4px + env(safe-area-inset-top)); transform: translateX(-50%);
        max-width: calc(100% - 16px); box-sizing: border-box; padding: 6px 10px; border-radius: 8px;
        font: bold 12px/1.3 sans-serif; white-space: nowrap; color: #fff; background: rgba(160, 40, 30, 0.92); border: 1px solid #ffb0a0;
        z-index: 20; cursor: pointer; text-align: center;
      }
      #save-notice.ok { background: rgba(30, 110, 60, 0.92); border-color: #a0e0b0; }
      #save-notice[hidden] { display: none; }
      /* ほかのタブで進めた時の帯（段階134）。タップで開き直す */
      #stale-notice {
        position: fixed; left: 50%; top: calc(4px + env(safe-area-inset-top)); transform: translateX(-50%);
        max-width: calc(100% - 16px); box-sizing: border-box; padding: 8px 12px; border-radius: 8px; white-space: nowrap;
        font: bold 13px/1.3 sans-serif; color: #fff; background: rgba(40, 60, 120, 0.95); border: 1px solid #a0c0ff;
        z-index: 21; cursor: pointer; text-align: center;
      }
      #stale-notice[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="build-info"></div>
    <div id="save-notice" role="status" hidden></div>
    <div id="stale-notice" role="alert" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
