<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
  body { background: #120612; }
  .bg { inset: 0; background: url('../../../public/assets/backgrounds/riverside_1998.webp') center 20% / cover; filter: brightness(.35) saturate(.6) hue-rotate(-20deg); }
  .slash { left: -60px; right: -60px; top: 350px; height: 150px; background: linear-gradient(90deg, #d7263d, #ff6b35); transform: rotate(-12deg); opacity: .9; box-shadow: 0 0 0 6px #000, 0 0 0 9px #fff; }
  .slash2 { left: -60px; right: -60px; top: 490px; height: 20px; background: #fff; transform: rotate(-12deg); }
  .enemy { left: 120px; top: 40px; width: 250px; height: 250px; background: url('../../../public/assets/enemies/kai.webp') center / contain no-repeat; filter: drop-shadow(0 0 12px #ff2d55); }
  .ename { right: 16px; top: 250px; font-size: 30px; font-style: italic; font-weight: 900; letter-spacing: 4px; color: #fff; text-shadow: 3px 3px 0 #d7263d; transform: skewX(-12deg); }
  .ehp { right: 16px; top: 294px; width: 190px; height: 12px; background: #000; transform: skewX(-20deg); border: 2px solid #fff; }
  .ehp i { display: block; height: 100%; width: 100%; background: #ff2d55; }
  /* 行動順：左上の斜めの札 */
  .order { left: 0; top: 16px; display: flex; flex-direction: column; gap: 6px; }
  .order div { width: 120px; height: 26px; transform: skewX(-15deg); background: #000c; border-left: 6px solid var(--c); font-size: 12px; line-height: 26px; padding-left: 14px; font-weight: bold; }
  .order div:first-child { width: 140px; background: #fff; color: #000; }
  /* 立ち絵のカットイン */
  .hero { left: -30px; top: 372px; width: 300px; height: 450px; background: url('../../../public/assets/portraits/hero_determined.webp') center top / cover; -webkit-mask-image: linear-gradient(180deg, #000 70%, transparent); }
  .who { left: 150px; top: 380px; font-size: 40px; font-weight: 900; font-style: italic; color: #fff; text-shadow: 4px 4px 0 #000; transform: rotate(-12deg); }
  .whoSub { left: 160px; top: 432px; font-size: 12px; background: #000; padding: 2px 10px; transform: rotate(-12deg); }
  /* 仲間の HP：右の斜めの帯 */
  .party { right: 0; top: 500px; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  .pa { width: 168px; height: 34px; transform: skewX(-15deg); background: #000d; border-right: 6px solid var(--c); padding: 3px 16px 0 12px; font-size: 11px; }
  .pa b { font-size: 13px; }
  .pa .bar { height: 5px; margin-top: 3px; background: #333; }
  .pa .bar i { display: block; height: 100%; background: #4cd07d; width: var(--hp); }
  .pa.on { background: #fff; color: #000; }
  /* 手札：インスタント写真（少し傾けて重ねる） */
  .hand { right: 6px; top: 612px; width: 380px; height: 160px; }
  .card { position: absolute; bottom: 4px; width: 74px; height: 122px; background: #fffdf6; padding: 5px 5px 0; box-shadow: 0 5px 10px rgba(0,0,0,.6); transform: rotate(var(--r)); color: #222; }
  .card .ph { height: 68px; background-size: cover; background-position: center; position: relative; }
  .card .el { position: absolute; right: -8px; top: -8px; width: 26px; height: 26px; border-radius: 50%; background: var(--c); color: #fff; font-size: 11px; font-weight: bold; display: grid; place-items: center; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.5); }
  .card .nm { font-family: 'Hand', 'IPAGothic'; font-size: 12px; text-align: center; margin-top: 4px; line-height: 1.15; }
  .card .wt { position: absolute; bottom: 3px; left: 0; right: 0; font-size: 8px; text-align: center; color: #8a7a6a; }
  .card.sel { bottom: 22px; box-shadow: 0 0 0 3px #ffd700, 0 8px 16px rgba(0,0,0,.6); }
  .card .tape { position: absolute; width: 38px; height: 12px; left: 18px; top: -7px; background: rgba(255,90,90,.7); transform: rotate(-6deg); }
  /* コマンド：下の斜めの帯 */
  .cmd { left: 0; right: 0; bottom: 0; height: 64px; background: #000; display: flex; align-items: center; gap: 6px; padding: 0 10px; border-top: 3px solid #fff; }
  .btn { flex: 1; height: 44px; transform: skewX(-15deg); background: #222; border: 2px solid #fff; font-size: 13px; font-weight: bold; display: grid; place-items: center; }
  .btn.go { flex: 1.4; background: #d7263d; font-size: 18px; }
  .btn.link { background: linear-gradient(90deg, #ffd700 94%, #333 94%); color: #000; }
  .tag { right: 8px; top: 4px; font-size: 9px; color: #fff8; }
</style></head><body>
<div class="abs bg"></div>
<div class="abs slash"></div><div class="abs slash2"></div>
<div class="abs enemy"></div>
<div class="abs ename">KAI カイ</div>
<div class="abs ehp"><i></i></div>
<div class="abs order"><div style="--c:#4aa8e8">1 ハルト</div><div style="--c:#ff2d55">2 カイ</div><div style="--c:#ff8fb1">3 あかり</div><div style="--c:#ffb347">4 みお</div></div>
<div class="abs hero"></div>
<div class="abs who">ハルト</div>
<div class="abs whoSub">行動を選べ ─ 敵の弱点：？</div>
<div class="abs party">
  <div class="pa on" style="--c:#4aa8e8;--hp:100%"><b>ハルト</b>　HP 312　MP 96<div class="bar"><i></i></div></div>
  <div class="pa" style="--c:#ff8fb1;--hp:100%"><b>あかり</b>　HP 284　MP 128<div class="bar"><i></i></div></div>
  <div class="pa" style="--c:#ffb347;--hp:70%"><b>みお</b>　HP 140　MP 60<div class="bar"><i></i></div></div>
</div>
<div class="abs hand">
  <div class="card" style="--c:#4aa8e8;--r:-6deg;left:8px"><div class="ph" style="background-image:url('../../../public/assets/cg/white_city.webp')"><span class="el">氷</span></div><div class="nm">アイス<br>ニードル</div><div class="wt">ふつう</div></div>
  <div class="card" style="--c:#8a96a8;--r:3deg;left:82px"><div class="ph" style="background-image:url('../../../public/assets/cg/cut_ground.webp')"><span class="el">物</span></div><div class="nm">ソード</div><div class="wt">ふつう</div></div>
  <div class="card sel" style="--c:#a98be0;--r:-2deg;left:156px"><span class="tape"></span><div class="ph" style="background-image:url('../../../public/assets/cg/photo_goldfish.webp')"><span class="el">✦</span></div><div class="nm">サーチ</div><div class="wt">その場で使う</div></div>
  <div class="card" style="--c:#a98be0;--r:4deg;left:230px"><div class="ph" style="background-image:url('../../../public/assets/cg/mio_cards.webp')"><span class="el">✦</span></div><div class="nm">ドロー</div><div class="wt">その場で使う</div></div>
  <div class="card" style="--c:#8a96a8;--r:-4deg;left:302px"><div class="ph" style="background-image:url('../../../public/assets/cg/awaken_weapons.webp')"><span class="el">物</span></div><div class="nm">ヘビー<br>ブロウ</div><div class="wt">とても重い</div></div>
</div>
<div class="abs tag">案2＋案4 カットイン×スナップ（イメージ）</div>
<div class="abs cmd"><div class="btn">魔法・スキル</div><div class="btn link">連携技 94%</div><div class="btn go">シャッター！</div></div>
</body></html>
