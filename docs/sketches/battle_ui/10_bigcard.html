<!doctype html>

<style>
  body { background: radial-gradient(ellipse at 50% 70%, #1d2550 0%, #0a0c1c 70%); }
  .bg { inset: 0 0 auto 0; height: 330px; background: url('../../../public/assets/backgrounds/riverside_1998.webp') center 30% / cover; filter: brightness(.5); -webkit-mask-image: linear-gradient(#000 60%, transparent); }
  .enemy { left: 120px; top: 34px; width: 150px; height: 200px; background: url('../../../public/assets/enemies/kai.webp') center / contain no-repeat; }

  .ehp { left: 130px; right: 130px; top: 256px; height: 6px; background: #400; border-radius: 3px; } .ehp i { display: block; height: 100%; width: 100%; background: #ff5f6d; border-radius: 3px; }
  .intent { left: 280px; top: 70px; font-size: 11px; background: #2a0d36dd; border: 1px solid #c58bff; border-radius: 10px; padding: 4px 8px; }
  /* 行動順：上の細い帯 */
  .order { left: 10px; top: 10px; display: flex; gap: 4px; }
  .order i { width: 26px; height: 26px; border-radius: 50%; background-size: 230%; background-position: 50% 10%; border: 2px solid #fff8; }

  /* 仲間：小さな丸を左右に */
  .party { left: 0; right: 0; top: 274px; display: flex; justify-content: center; gap: 30px; }
  .pa { text-align: center; font-size: 10px; }
  .pa i { display: block; width: 48px; height: 48px; margin: 0 auto 2px; border-radius: 50%; background-size: 230%; background-position: 50% 10%; border: 3px solid var(--c); }
  .pa.on i { box-shadow: 0 0 0 3px #ffd76a, 0 0 14px #ffd76a; }
  .pa .hp { height: 4px; width: 48px; margin: 2px auto 0; background: #333; border-radius: 2px; } .pa .hp i { display: block; width: auto; height: 100%; border: none; margin: 0; background: #4cd07d; border-radius: 2px; box-shadow: none; }
  /* 大きなカード：真ん中の1枚を大きく、左右は小さく */
  .card { position: absolute; border-radius: 16px; overflow: hidden; background: #111; border: 3px solid var(--c); box-shadow: 0 10px 30px #000c; }
  .card .art { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .card .shade { position: absolute; left: 0; right: 0; bottom: 0; height: 55%; background: linear-gradient(transparent, #000e 45%); }
  .card .cost { position: absolute; left: 10px; top: 10px; width: 40px; height: 40px; border-radius: 50%; background: var(--c); border: 2px solid #fff; display: grid; place-items: center; font-size: 13px; font-weight: bold; }
  .card .el { position: absolute; right: 10px; top: 12px; font-size: 12px; background: #000a; border: 1px solid var(--c); padding: 2px 8px; border-radius: 10px; }
  .card .nm { position: absolute; left: 0; right: 0; bottom: 64px; text-align: center; font-size: 24px; font-weight: 900; letter-spacing: 1px; text-shadow: 0 2px 6px #000; }
  .card .tx { position: absolute; left: 12px; right: 12px; bottom: 30px; text-align: center; font-size: 12px; color: #dde; }
  .card .wt { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font-size: 11px; color: #ffcf6a; letter-spacing: 2px; }
  .main { left: 85px; top: 352px; width: 220px; height: 310px; }
  .side { width: 150px; height: 214px; top: 400px; opacity: .55; filter: brightness(.7); }
  .side .nm { font-size: 16px; bottom: 40px; } .side .tx { display: none; }
  .l { left: -70px; transform: rotate(-8deg); } .r { right: -70px; transform: rotate(8deg); }
  .dots { left: 0; right: 0; top: 672px; text-align: center; font-size: 10px; letter-spacing: 6px; color: #fff6; }
  .dots b { color: #ffd76a; }
  .swipe { left: 0; right: 0; top: 690px; text-align: center; font-size: 11px; color: #cfd8ee; }
  .foot { left: 10px; right: 10px; bottom: 16px; height: 96px; display: grid; grid-template-columns: 1fr 1fr 1.4fr; gap: 8px; align-items: end; }
  .b { height: 56px; border-radius: 12px; background: #1d2440; border: 1px solid #3a4a70; display: grid; place-items: center; font-size: 12px; text-align: center; }
  .use { height: 84px; border-radius: 14px; background: linear-gradient(180deg, #ffd76a, #c9963a); color: #2a1800; display: grid; place-items: center; font-size: 18px; font-weight: 900; box-shadow: 0 0 20px #ffd76a66; text-align: center; line-height: 1.3; }
  .use small { font-size: 11px; font-weight: normal; }
  .tag { right: 8px; top: 10px; font-size: 9px; color: #fff7; }
