<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
  body { background: #0a0f1e; }
  .bg { inset: 0 0 auto 0; height: 380px; background: url('../../../public/assets/backgrounds/riverside_1998.webp') center 35% / cover; filter: brightness(.5); }
  .fade { left: 0; right: 0; top: 300px; height: 80px; background: linear-gradient(transparent, #0a0f1e); }
  /* 横向きの戦い：敵は左、仲間は右 */
  .enemy { left: -10px; top: 60px; width: 220px; height: 260px; background: url('../../../public/assets/enemies/kai.webp') center / contain no-repeat; }
  .ehp { left: 20px; top: 40px; width: 160px; font-size: 11px; }
  .ehp .bar { height: 8px; border-radius: 4px; background: #300; margin-top: 3px; }
  .ehp .bar i { display: block; height: 100%; width: 100%; border-radius: 4px; background: #ff5f6d; }
  .ally { width: 74px; height: 120px; background-size: cover; background-position: 50% 0; border-radius: 8px; -webkit-mask-image: linear-gradient(#000 75%, transparent); }
  .a1 { right: 92px; top: 92px; } .a2 { right: 12px; top: 140px; } .a3 { right: 92px; top: 196px; }
  .hp { width: 74px; font-size: 9px; text-align: center; text-shadow: 0 1px 2px #000; }
  .hp i { display: block; height: 4px; margin: 2px 6px 0; background: #4cd07d; border-radius: 2px; }
  .h1 { right: 92px; top: 206px; } .h2 { right: 12px; top: 254px; } .h3 { right: 92px; top: 310px; }
  .round { left: 0; right: 0; top: 10px; text-align: center; font-size: 13px; letter-spacing: 3px; color: #ffe6a8; text-shadow: 0 1px 3px #000; }
  /* 時の帯（計画表） */
  .lane { left: 10px; right: 10px; top: 372px; height: 168px; border-radius: 14px; background: linear-gradient(180deg, #1a2140, #11172c); border: 1px solid #c9b27a88; box-shadow: inset 0 0 20px #0008; }
  .lane .ttl { position: absolute; left: 12px; top: 8px; font-size: 11px; color: #c9b27a; letter-spacing: 2px; }
  .lane .ttl2 { position: absolute; right: 12px; top: 8px; font-size: 10px; color: #8aa0c8; }
  .track { position: absolute; left: 12px; right: 12px; top: 92px; height: 4px; background: linear-gradient(90deg, #ffd76a, #c58bff, #4aa8e8); border-radius: 2px; }
  .step { position: absolute; top: 28px; width: 80px; text-align: center; }
  .step .who { width: 32px; height: 32px; margin: 0 auto; border-radius: 50%; background-size: 220%; background-position: 50% 10%; border: 2px solid #fff; }
  .step .who.foe { background: #8a2433; display: grid; place-items: center; font-size: 13px; }
  .step .dot { width: 12px; height: 12px; border-radius: 50%; background: #ffd76a; margin: 22px auto 0; box-shadow: 0 0 8px #ffd76a; }
  .step .put { margin: 8px auto 0; width: 70px; height: 46px; border-radius: 8px; border: 2px dashed #ffffff44; font-size: 10px; color: #fff8; display: grid; place-items: center; }
  .step .put.filled { border: 2px solid #4aa8e8; background: #4aa8e822; color: #fff; font-size: 11px; font-weight: bold; }
  .step .put.foe { border-color: #ff5f6d88; color: #ffb0b0; }
  .s1 { left: 6px; } .s2 { left: 92px; } .s3 { left: 178px; } .s4 { left: 264px; }
  /* 手札 */
  .hint { left: 0; right: 0; top: 552px; text-align: center; font-size: 11px; color: #cfd8ee; }
  .hand { left: 8px; right: 8px; top: 574px; height: 150px; display: flex; gap: 6px; }
  .card { flex: 1; border-radius: 10px; background: linear-gradient(180deg, #232b4a, #161c33); border: 2px solid var(--c); position: relative; overflow: hidden; }
  .card .top { height: 22px; background: var(--c); color: #0b1020; font-size: 10px; font-weight: bold; text-align: center; line-height: 22px; }
  .card .ic { font-size: 30px; text-align: center; margin-top: 10px; }
  .card .nm { font-size: 12px; font-weight: bold; text-align: center; margin-top: 6px; line-height: 1.2; }
  .card .wt { position: absolute; bottom: 6px; left: 0; right: 0; text-align: center; font-size: 9px; color: #c9b27a; }
  .card .spd { position: absolute; top: 26px; right: 4px; font-size: 9px; color: #ffd76a; }
  .card.used { opacity: .35; }
  /* 下 */
  .foot { left: 8px; right: 8px; bottom: 14px; height: 62px; display: flex; gap: 6px; }
  .b { flex: 1; border-radius: 10px; background: #1d2540; border: 1px solid #3a4a70; display: grid; place-items: center; font-size: 12px; font-weight: bold; text-align: center; }
  .b.go { flex: 1.6; background: linear-gradient(180deg, #c9a24a, #8a6420); border: 2px solid #ffe6a8; font-size: 17px; color: #2a1800; }
  .tag { right: 8px; top: 28px; font-size: 9px; color: #fff8; }
</style></head><body>
<div class="abs bg"></div><div class="abs fade"></div>
<div class="abs round">― ラウンド 1 ―</div>
<div class="abs ehp">カイ　1800/1800<div class="bar"><i></i></div></div>
<div class="abs enemy"></div>
<div class="abs ally a1" style="background-image:url('../../../public/assets/portraits/hero_determined.webp')"></div>
<div class="abs ally a2" style="background-image:url('../../../public/assets/portraits/akari_serious.webp')"></div>
<div class="abs ally a3" style="background-image:url('../../../public/assets/portraits/mio_smile.webp');background-size:100% auto;background-position:50% 0;background-repeat:no-repeat"></div>
<div class="abs hp h1">ハルト 312<i></i></div>
<div class="abs hp h2">あかり 284<i></i></div>
<div class="abs hp h3">みお 140<i style="width:60%"></i></div>
<div class="abs lane">
  <div class="ttl">時の帯　― 速い順に動く ―</div><div class="ttl2">重い札ほど右（後）へ</div>
  <div class="track"></div>
  <div class="step s1"><div class="who" style="background-image:url('../../../public/assets/portraits/hero_determined.webp')"></div><div class="dot"></div><div class="put filled">アイス<br>ニードル</div></div>
  <div class="step s2"><div class="who foe">カ</div><div class="dot" style="background:#ff5f6d;box-shadow:0 0 8px #ff5f6d"></div><div class="put foe">⚡ 力をためる</div></div>
  <div class="step s3"><div class="who" style="background-image:url('../../../public/assets/portraits/akari_serious.webp')"></div><div class="dot" style="opacity:.4"></div><div class="put">ここに<br>はめる</div></div>
  <div class="step s4"><div class="who" style="background-image:url('../../../public/assets/portraits/mio_smile.webp')"></div><div class="dot" style="opacity:.4"></div><div class="put">ここに<br>はめる</div></div>
</div>
<div class="abs hint">あかりの番：カードを「時の帯」へ引いてはめる</div>
<div class="abs hand">
  <div class="card used" style="--c:#4aa8e8"><div class="top">氷</div><div class="ic">❄</div><div class="nm">アイス<br>ニードル</div><div class="wt">ハルトが使う</div></div>
  <div class="card" style="--c:#8a96a8"><div class="top">物理</div><div class="spd">速</div><div class="ic">⚔</div><div class="nm">ソード</div><div class="wt">■■□□</div></div>
  <div class="card" style="--c:#a98be0"><div class="top">サポート</div><div class="ic">🔍</div><div class="nm">サーチ</div><div class="wt">その場で使う</div></div>
  <div class="card" style="--c:#a98be0"><div class="top">サポート</div><div class="ic">🂠</div><div class="nm">ドロー</div><div class="wt">その場で使う</div></div>
  <div class="card" style="--c:#8a96a8"><div class="top">物理</div><div class="spd">遅</div><div class="ic">🔨</div><div class="nm">ヘビー<br>ブロウ</div><div class="wt">■■■■</div></div>
</div>
<div class="abs foot"><div class="b">魔法・<br>スキル</div><div class="b">連携技<br><span style="font-size:10px;color:#ffd76a">94%</span></div><div class="b go">時を進める</div></div>
<div class="abs tag">案3 計画表（イメージ）</div>
</body></html>
