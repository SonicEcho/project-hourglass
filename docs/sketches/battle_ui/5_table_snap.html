<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
  .bg { inset: 0 0 auto 0; height: 520px; background: url('../../../public/assets/backgrounds/riverside_1998.webp') center 30% / cover; filter: sepia(.4) brightness(.55) saturate(.9); }
  .vignette { inset: 0; background: radial-gradient(ellipse at 50% 30%, transparent 30%, rgba(5,8,20,.85) 80%); }
  /* 敵 */
  .enemy { left: 75px; top: 70px; width: 240px; height: 240px; background: url('../../../public/assets/enemies/kai.webp') center / contain no-repeat; filter: drop-shadow(0 0 18px rgba(120,200,255,.5)); }
  .ename { left: 0; right: 0; top: 312px; text-align: center; font-size: 15px; letter-spacing: 2px; text-shadow: 0 2px 4px #000; }
  .ehp { left: 95px; width: 200px; top: 336px; height: 10px; border-radius: 5px; background: #2a0d12; border: 1px solid #ff8a8a55; overflow: hidden; }
  .ehp i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #ff5f6d, #ffc371); }
  .intent { right: 22px; top: 92px; width: 72px; padding: 6px 4px; border-radius: 10px; background: rgba(30,10,40,.85); border: 1px solid #c58bff; text-align: center; font-size: 10px; line-height: 1.4; }
  .intent b { display: block; font-size: 20px; color: #ffcf6a; }
  /* 行動順：上の砂時計の帯 */
  .order { left: 10px; top: 12px; right: 10px; height: 46px; display: flex; gap: 8px; align-items: center; padding: 0 10px; border-radius: 23px; background: rgba(0,0,0,.45); border: 1px solid #ffffff22; }
  .order .lab { font-size: 10px; color: #ffd76a; }
  .chip { width: 34px; height: 34px; border-radius: 50%; background-size: 220%; background-position: 50% 12%; border: 2px solid #fff6; }
  .chip.foe { background: #8a2433; display: grid; place-items: center; font-size: 13px; }
  .arrow { color: #fff6; font-size: 10px; }
  /* 仲間：丸いメダル＋HPの輪 */
  .party { left: 0; right: 0; top: 362px; display: flex; justify-content: center; gap: 22px; }
  .ally { width: 92px; text-align: center; }
  .medal { width: 74px; height: 74px; margin: 0 auto; border-radius: 50%; padding: 5px; background: conic-gradient(#4cd07d 0 var(--hp), #1d2a22 var(--hp) 100%); position: relative; }
  .medal div { width: 100%; height: 100%; border-radius: 50%; background-size: 230%; background-position: 50% 10%; border: 2px solid #0b1020; }
  .ally.on .medal { box-shadow: 0 0 0 3px #ffd76a, 0 0 18px #ffd76a; }
  .ally .nm { font-size: 12px; margin-top: 4px; }
  .ally .mp { font-size: 10px; color: #7fb6ff; }
  .ally .slot { margin: 4px auto 0; width: 54px; height: 20px; border-radius: 6px; border: 1px dashed #ffffff55; font-size: 9px; color: #fff8; line-height: 18px; }
  /* 卓（下半分） */
  .table { left: -20px; right: -20px; top: 520px; bottom: 0; background:
      repeating-linear-gradient(90deg, #6a4428 0 2px, transparent 2px 46px),
      linear-gradient(180deg, #8a5a34 0%, #6e4526 60%, #553419 100%); border-top: 10px solid #3a2414; box-shadow: inset 0 12px 20px rgba(0,0,0,.5); }
  .table::before { content: ''; position: absolute; left: 0; right: 0; top: -10px; height: 4px; background: #c79a5a; }
  .pile { width: 46px; height: 64px; border-radius: 3px; background: #3a2a4a; border: 2px solid #c9b27a; box-shadow: 3px 3px 0 #f3ead8, 6px 6px 0 #e6dcc8; font-size: 10px; text-align: center; padding-top: 22px; }
  .deck { left: 10px; top: 540px; transform: scale(.8); transform-origin: left top; }
  .disc { right: 10px; top: 540px; transform: scale(.8); transform-origin: right top; background: #333; border-color: #777; box-shadow: none; }
  .hint { left: 0; right: 0; top: 540px; text-align: center; font-family: 'Hand', 'IPAGothic'; font-size: 14px; color: #ffe6c0; }
  /* 手札：扇形 */
  .hand { left: 0; right: 0; top: 586px; height: 170px; }
  .card { position: absolute; width: 84px; height: 132px; top: 14px; transform-origin: 50% 100%; background: #fffdf6; padding: 5px 5px 0; box-shadow: 0 6px 12px rgba(0,0,0,.55); color: #2a2230; }
  .card .ph { height: 74px; background-size: cover; background-position: center; position: relative; }
  .card .gem { position: absolute; right: -8px; top: -8px; width: 26px; height: 26px; border-radius: 50%; background: var(--c); color: #fff; font-size: 11px; font-weight: bold; display: grid; place-items: center; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.4); }
  .card .nm { text-align: center; font-family: 'Hand', 'IPAGothic'; font-size: 13px; white-space: nowrap; letter-spacing: -0.5px; margin-top: 4px; }
  .card .tx { text-align: center; font-size: 8px; color: #6a5a4a; margin-top: 1px; }
  .card .wt { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; font-size: 8px; color: #a07a4a; letter-spacing: 1px; }
  .card.sel { top: -8px; box-shadow: 0 0 0 3px #ffd76a, 0 0 22px #ffd76a; }
  .card .tape { position: absolute; width: 40px; height: 13px; left: 22px; top: -8px; background: rgba(255,200,120,.75); transform: rotate(-5deg); }
  /* ボタン */
  .watch { right: 14px; bottom: 18px; width: 76px; height: 76px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #fff7d6, #d6a648 60%, #8a6420); border: 3px solid #fff1b8; display: grid; place-items: center; font-size: 13px; font-weight: bold; color: #3a2400; box-shadow: 0 4px 12px rgba(0,0,0,.6); }
  .watch::before { content: ''; position: absolute; top: -10px; left: 36px; width: 12px; height: 10px; border-radius: 3px; background: #d6a648; }
  .book { left: 14px; bottom: 24px; width: 76px; height: 64px; border-radius: 8px; background: linear-gradient(135deg, #4a2a6a, #2a1a40); border: 2px solid #c58bff; font-size: 11px; text-align: center; padding-top: 6px; line-height: 1.3; }
  .book b { font-size: 18px; display: block; }
  .link { left: 100px; right: 100px; bottom: 40px; height: 30px; border-radius: 15px; background: #0006; border: 1px solid #ffd76a88; font-size: 10px; text-align: center; line-height: 28px; overflow: hidden; }
  .link i { position: absolute; left: 0; top: 0; bottom: 0; width: 94%; background: linear-gradient(90deg, #ff9a5a55, #ffd76a99); }
  .link span { position: relative; }
  .tag { left: 8px; bottom: 6px; font-size: 9px; color: #fff7; }
</style></head><body>
