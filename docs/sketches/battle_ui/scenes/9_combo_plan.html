<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../common.css"><link rel="stylesheet" href="scenes.css">
<style>
  body { background: #0b0b0e; }
  .bg { inset: 0 0 auto 0; height: 420px; background: url('../../../../public/assets/backgrounds/riverside_1998.webp') center 25% / cover; filter: brightness(.45) contrast(1.15) saturate(.7); }
  .enemy { left: 70px; top: 26px; width: 270px; height: 310px; background: url('../../../../public/assets/enemies/kai.webp') center / contain no-repeat; filter: drop-shadow(0 0 10px #ff2d55); }
  .rec { left: 14px; top: 14px; font-size: 12px; color: #ff2d55; font-weight: bold; letter-spacing: 2px; } .rec::before { content: '●'; margin-right: 4px; }
  .round { right: 14px; top: 10px; font-size: 13px; font-weight: 900; font-style: italic; letter-spacing: 2px; }
  .round b { font-size: 34px; color: #fff; text-shadow: 2px 2px 0 #ff2d55; }
  .ename { right: 14px; top: 286px; font-size: 24px; font-weight: 900; font-style: italic; transform: skewX(-12deg); text-shadow: 3px 3px 0 #ff2d55; }
  .ehp { right: 14px; top: 320px; width: 170px; height: 10px; background: #000; border: 2px solid #fff; transform: skewX(-20deg); } .ehp i { display: block; height: 100%; width: 100%; background: #ff2d55; }
  .intent { left: 14px; top: 306px; font-size: 11px; background: #fff; color: #000; padding: 2px 10px; transform: skewX(-12deg); font-weight: bold; }
  /* 横のフィルム */
  .film { left: 0; right: 0; top: 352px; height: 170px; background: #111; border-top: 2px solid #fff; border-bottom: 2px solid #fff; }
  .holes { position: absolute; left: 0; right: 0; height: 9px; background: repeating-linear-gradient(90deg, transparent 0 7px, #e8e0d0 7px 16px, transparent 16px 22px); }
  .holes.t { top: 5px; } .holes.bt { bottom: 5px; }
  .frames { position: absolute; left: 8px; right: 8px; top: 18px; bottom: 18px; display: flex; gap: 6px; }
  .fr { flex: 1; background: #2b2420; position: relative; overflow: hidden; transform: skewX(-8deg); }
  .fr .ph { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .fr .lb { position: absolute; left: 0; right: 0; bottom: 0; background: #000c; font-size: 10px; text-align: center; padding: 2px 0; font-weight: bold; }
  .fr .n { position: absolute; left: 6px; top: 0; font-size: 14px; font-weight: 900; font-style: italic; color: #fff; text-shadow: 2px 2px 0 #ff2d55; }
  .fr .who { position: absolute; right: 4px; top: 4px; width: 20px; height: 20px; border-radius: 50%; background-size: 230%; background-position: 50% 10%; border: 2px solid #fff; }
  .fr.foe .ph { background: repeating-linear-gradient(45deg, #5a0c1c 0 6px, #3a0812 6px 12px); }
  .fr.now { box-shadow: inset 0 0 0 3px #ff2d55; background: #ff2d5522; }
  .fr.empty { display: grid; place-items: center; font-size: 11px; font-weight: bold; color: #fff9; }
  /* 斜めの帯の中のカットイン */
  .party { left: 6px; right: 6px; top: 540px; height: 62px; display: flex; gap: 6px; }
  .tab { flex: 1; transform: skewX(-12deg); background: #000d; border: 2px solid #ffffff55; border-bottom: 4px solid var(--c); position: relative; overflow: hidden; padding: 4px 8px; font-size: 11px; font-weight: bold; }
  .tab .f { position: absolute; right: -4px; bottom: 0; width: 44px; height: 60px; background-size: cover; background-position: 50% 0; transform: skewX(12deg); opacity: .5; }
  .tab .bar { height: 4px; background: #333; margin-top: 4px; width: 66%; } .tab .bar i { display: block; height: 100%; background: #4cd07d; }
  .tab .mp { font-size: 9px; color: #7fb6ff; margin-top: 2px; }
  .tab.on { flex: 1.7; background: #fff; color: #000; border-color: #fff; box-shadow: 4px 4px 0 #ffd700; }
  .tab.on .f { width: 70px; height: 84px; opacity: 1; }
  .tab.on .nm { font-size: 18px; font-style: italic; font-weight: 900; line-height: 1.1; }
  .tab.on .go { font-size: 10px; color: #c89a00; margin-top: 2px; }
  .fr .face { position: absolute; inset: 0; background: url('../../../../public/assets/portraits/akari_serious.webp') 50% 12% / 170%; }
  .fr .sel { position: absolute; left: 0; right: 0; top: 40%; text-align: center; font-size: 15px; font-weight: 900; font-style: italic; color: #fff; text-shadow: 2px 2px 0 #ff2d55, 0 0 6px #000; }
  .fr .hpm { position: absolute; left: 0; right: 0; bottom: 0; background: #ff2d55; font-size: 10px; text-align: center; font-weight: bold; padding: 2px 0; }
  .pa { width: 116px; height: 24px; transform: skewX(-15deg); background: #000d; border-left: 5px solid var(--c); padding: 2px 10px; font-size: 10px; font-weight: bold; }
  .pa .bar { height: 3px; margin-top: 2px; background: #333; } .pa .bar i { display: block; height: 100%; background: #4cd07d; width: var(--hp); }
  .pa.on { background: #fff; color: #000; }
  /* 手札 */
  .hand { left: 6px; right: 6px; top: 612px; height: 160px; }
  .card { position: absolute; bottom: 0; width: 72px; height: 146px; background: #fff; color: #000; border: 3px solid #000; box-shadow: 4px 4px 0 var(--c); transform: skewX(-8deg); padding: 3px; }
  .card .ph { height: 76px; background-size: cover; background-position: center; }
  .card .el { position: absolute; left: 3px; top: 3px; font-size: 9px; color: #fff; background: var(--c); padding: 1px 4px; font-weight: bold; }
  .card .nm { font-size: 12px; font-weight: 900; text-align: center; margin-top: 4px; line-height: 1.15; }
  .card .wt { position: absolute; bottom: 3px; left: 0; right: 0; font-size: 8px; text-align: center; color: #555; }
  .card.sel { bottom: 16px; box-shadow: 4px 4px 0 var(--c), 0 0 0 3px #ff2d55; }
  .cmd { left: 0; right: 0; bottom: 0; height: 64px; background: #000; display: flex; align-items: center; gap: 6px; padding: 0 10px; border-top: 3px solid #fff; }
  .btn { flex: 1; height: 44px; transform: skewX(-15deg); background: #222; border: 2px solid #fff; font-size: 13px; font-weight: bold; display: flex; align-items: center; justify-content: center; }
  .btn.go { flex: 1.3; background: #ff2d55; font-size: 16px; }
  .btn.go::before { content: '●'; margin-right: 6px; }
  .btn.link { background: linear-gradient(90deg, #ffd700 94%, #333 94%); color: #000; }
  .tag { left: 14px; top: 34px; font-size: 9px; color: #fff7; }
</style></head><body>
